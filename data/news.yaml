news:
  - date: "2026-09"
    title: "A New Beginning!"
    description: |
      ManuFuture Laboratory (MFL)가 새롭게 오픈하였습니다.

      ManuFuture Lab은 Manufacture + Future, 이름 그대로 미래의 제조기술을 고민하고 만들어가는 연구실입니다.

      MFL의 로고에도 저희연구가 향후 제조기술의 문을 여는 하나의 열쇠가 되기를 바라는 마음을 담았습니다.

      앞으로 연구 성과 등 다양한 소식을 지속적으로 업데이트할 예정입니다. 많은 관심 부탁드립니다.

      Welcome to ManuFuture Laboratory. Let’s shape the future of manufacturing!
    image: "media/news/hanyang-erica-campus-fountain.jpg"
    url: "#"
