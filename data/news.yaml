news:
  - date: "2026-08"
    title: "ManuFuture Laboratory is Born!"
    description: "무더운 여름의 끝자락,
ManuFuture Laboratory (MFL) ​가 새롭게 오픈하였습니다.

ManuFuture Lab은 Manufacturing + Future, 이름 그대로 미래의 제조기술을 고민하고 만들어가는 연구실입니다.
표면과 계면에서 일어나는 마찰, 마모, 변형을 이해하고 제어하여, 정밀 연마, 반도체 패키징 등 다양한 첨단 제조기술을 연구해 나가고자 합니다.

MFL의 로고에도 이런 의미를 담았습니다.
M과 F를 하나로 연결해 열쇠 모양으로 만들어보았는데요, 
우리의 연구가 미래 제조의 문을 여는 하나의 열쇠가 되기를 바라는 마음을 담았습니다.

이제 막 첫걸음을 내딛는 연구실이지만,
앞으로 이곳을 통해 새로운 연구, 논문과 학회 소식, 연구실 구성원들의 이야기, 그리고 MFL이 성장해가는 과정​을 차근차근 공유하겠습니다.

Welcome to ManuFuture Laboratory.
Let’s shape the future of manufacturing!"
